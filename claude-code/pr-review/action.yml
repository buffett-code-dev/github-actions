name: 'Claude PR Review'
description: 'Claude Agent SDKによるPRレビューとIssue対応'
author: 'buffett-code-dev'

inputs:
  anthropic_api_key:
    description: 'Anthropic API Key'
    required: true
  allowed_bots:
    description: '許可するボットのリスト（カンマ区切り）'
    required: false
    default: ''
  checkout_fetch_depth:
    description: 'チェックアウト時のfetch-depth'
    required: false
    default: '1'
  github_token:
    description: 'GitHubの操作に使うトークン。省略時は従来どおり OIDC で Claude GitHub App のトークンを取得する'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: ${{ inputs.checkout_fetch_depth }}
        ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
        persist-credentials: false

    - name: Run Claude PR Review with Agent SDK
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        GH_TOKEN: ${{ inputs.github_token }}
        ALLOWED_BOTS: ${{ inputs.allowed_bots }}
      run: bash "$ACTION_PATH/../agent/run.sh"
