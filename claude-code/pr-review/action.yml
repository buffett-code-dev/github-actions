name: 'Claude PR Review'
description: 'Claude Code ActionによるPRレビューとIssue対応'
author: 'buffett-code-dev'

inputs:
  anthropic_api_key:
    description: 'Anthropic API Key'
    required: true
  allowed_bots:
    description: '許可するボットのリスト（カンマ区切り）'
    required: false
    default: ''
  checkout_fetch_depth:
    description: 'チェックアウト時のfetch-depth'
    required: false
    default: '1'
  github_token:
    description: 'GitHubの操作に使うトークン。渡すとClaude GitHub Appのトークンを取りに行かないので、呼び出し側でid-token: writeが不要になる。空のときは従来どおりGitHub Appのトークンを使う'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: ${{ inputs.checkout_fetch_depth }}

    - name: Run Claude PR Action
      # よりセキュアに運用するため、v1 と記載せずにパッチバージョンまで明記している
      uses: anthropics/claude-code-action@v1.0.262
      with:
        anthropic_api_key: ${{ inputs.anthropic_api_key }}
        allowed_bots: ${{ inputs.allowed_bots }}
        github_token: ${{ inputs.github_token }}
        claude_args: |
          --model claude-sonnet-5
